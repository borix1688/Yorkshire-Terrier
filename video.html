    <style>
        /* Container that forces the 2x2 layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            /* 2 equal columns */
            gap: 20px;
            /* Space between videos */
            max-width: 1200px;
            /* Max layout width */
            margin: 0 auto;
            /* Center on screen */
            padding: 20px;
        }

        /* Responsive wrapper to maintain 16:9 widescreen ratio */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            /* 16:9 Aspect Ratio (9 / 16 = 0.5625) */
            height: 0;
        }

        /* Makes the actual iframe stretch completely inside the wrapper */
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Optional: Stack videos into 1 column on small mobile screens */
        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>


</head>
